name: Extract project zip

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract project zip
        run: |
          mkdir -p /tmp/extracted
          unzip -o doorstep-fix-project.zip -d /tmp/extracted
          SRC=/tmp/extracted
          if [ ! -f "$SRC/pubspec.yaml" ]; then
            FOUND=$(find "$SRC" -maxdepth 3 -name pubspec.yaml | head -n 1)
            if [ -n "$FOUND" ]; then SRC=$(dirname "$FOUND"); fi
          fi
          echo "Extracting from $SRC"
          ls -la "$SRC"
          cp -a "$SRC"/. .
          rm -f doorstep-fix-project.zip
          ls -la
      - name: Commit extracted files
        run: |
          git config user.name "smmurtazax-commits"
          git config user.email "sm.murtazax@gmail.com"
          git add -A
          git status --short
          git commit -m "Extract DoorStep Fix project files" || echo "Nothing to commit"
          git push
